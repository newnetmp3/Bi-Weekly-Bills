[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-weekly-bills"
version = "1.0.0"
description = "Bi-weekly household bill manager with Plaid, SQLite, ODS import/export, and PySide6 desktop UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "plaid-python>=43,<44",
  "python-dotenv>=1.0,<2",
  "PySide6>=6.8,<7",
  "openpyxl>=3.1,<4",
  "reportlab>=4.2,<5",
  "odfpy>=1.4,<2",
]

[project.scripts]
biweekly-bills = "biweekly_bills.cli:main"
biweekly-bills-app = "biweekly_bills.desktop_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biweekly_bills = [
  "assets/icons/scalable/apps/*.svg",
  "assets/branding/*.svg",
  "assets/desktop/*.desktop.in",
]

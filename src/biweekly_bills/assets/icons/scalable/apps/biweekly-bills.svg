<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#274f82"/>
      <stop offset=".34" stop-color="#15375f"/>
      <stop offset="1" stop-color="#061a36"/>
    </linearGradient>
    <linearGradient id="paper" x1=".1" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#e9f4ff"/>
      <stop offset="1" stop-color="#a9cdee"/>
    </linearGradient>
    <linearGradient id="calTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#315d91"/>
      <stop offset="1" stop-color="#15385f"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6ff34"/>
      <stop offset=".46" stop-color="#69ed27"/>
      <stop offset="1" stop-color="#08af34"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e7f4ff"/>
      <stop offset="1" stop-color="#76a9d7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020b18" flood-opacity=".62"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#031329" flood-opacity=".48"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#navy)" stroke="#32649d" stroke-width="7" filter="url(#shadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="#0a274b" stroke-width="5" opacity=".85"/>

  <!-- bill sheet -->
  <g filter="url(#soft)">
    <path d="M136 82h194l72 72v135H136z" fill="url(#paper)" stroke="#d8ebfb" stroke-width="3"/>
    <path d="M330 82v45c0 20 16 36 36 36h36z" fill="#c8e3f6" opacity=".9"/>
    <text x="165" y="190" font-family="DejaVu Sans, sans-serif" font-size="88" font-weight="800" fill="#0a2a51">$</text>
    <g fill="#557fa7">
      <rect x="254" y="129" width="103" height="17" rx="9"/>
      <rect x="254" y="166" width="126" height="17" rx="9"/>
      <rect x="254" y="203" width="139" height="17" rx="9"/>
      <rect x="205" y="247" width="164" height="17" rx="9"/>
    </g>
  </g>

  <!-- calendar -->
  <g filter="url(#shadow)">
    <path d="M104 247h304c25 0 45 20 45 45v132c0 27-22 49-49 49H108c-27 0-49-22-49-49V292c0-25 20-45 45-45z" fill="url(#paper)" stroke="#7db4e0" stroke-width="4"/>
    <path d="M104 247h304c25 0 45 20 45 45v28H59v-28c0-25 20-45 45-45z" fill="url(#calTop)" stroke="#3f75aa" stroke-width="4"/>
    <line x1="256" y1="320" x2="256" y2="468" stroke="#0a2a51" stroke-width="9" opacity=".96"/>
    <g fill="url(#silver)" stroke="#0a2a51" stroke-width="5">
      <rect x="124" y="224" width="26" height="77" rx="13"/>
      <rect x="362" y="224" width="26" height="77" rx="13"/>
    </g>
    <text x="130" y="414" font-family="DejaVu Sans, sans-serif" font-size="96" font-weight="800" fill="#08264b">1</text>
    <text x="305" y="414" font-family="DejaVu Sans, sans-serif" font-size="91" font-weight="800" fill="#08264b">15</text>
    <rect x="111" y="432" width="104" height="16" rx="8" fill="#6e97bd"/>
    <rect x="302" y="432" width="104" height="16" rx="8" fill="#6e97bd"/>
  </g>

  <!-- bi-weekly arrow -->
  <g filter="url(#soft)">
    <path d="M198 390c20-35 43-49 82-51v-18c0-8 9-12 15-7l43 42c5 5 5 13 0 18l-43 42c-6 6-15 1-15-7v-19c-26 1-43 9-59 30-8 10-24 9-31 0-6-8-3-20 8-30z" fill="url(#green)" stroke="#2bb920" stroke-width="4"/>
  </g>

  <!-- paid check -->
  <g filter="url(#shadow)">
    <circle cx="393" cy="216" r="72" fill="url(#green)" stroke="#a9ff36" stroke-width="6"/>
    <path d="M359 214l24 24 48-55" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

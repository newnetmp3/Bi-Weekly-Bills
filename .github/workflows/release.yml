name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit-arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Audit release in Arch Linux
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:base \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm python python-pip libglvnd libxkbcommon libxkbcommon-x11 libxcb fontconfig
              python -m venv /tmp/biweekly-bills-release
              /tmp/biweekly-bills-release/bin/python -m pip install --upgrade pip
              /tmp/biweekly-bills-release/bin/pip install -e . ruff build
              /tmp/biweekly-bills-release/bin/python -m compileall -q src tests
              /tmp/biweekly-bills-release/bin/ruff check src tests --select E9,F63,F7,F82
              /tmp/biweekly-bills-release/bin/pip check
              /tmp/biweekly-bills-release/bin/python -m unittest discover -s tests -v
              /tmp/biweekly-bills-release/bin/biweekly-bills --help >/dev/null
              /tmp/biweekly-bills-release/bin/biweekly-bills-app --help >/dev/null
              rm -rf /tmp/biweekly-bills-dist
              /tmp/biweekly-bills-release/bin/python -m build --wheel --outdir /tmp/biweekly-bills-dist
              test -n "$(find /tmp/biweekly-bills-dist -maxdepth 1 -name "*.whl" -print -quit)"
            '

  publish:
    needs: audit-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build release artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi

          if [ "$VERSION" = "1.0.0" ]; then
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Bi-Weekly Bills $TAG" \
              --notes-file docs/RELEASE_NOTES_1.0.md
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Bi-Weekly Bills $TAG" \
              --generate-notes
          fi
